server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # הגשת קבצים שכבר נדחסו ע"י vite-plugin-compression2 (gzip/brotli)
    gzip_static on;

    # SPA fallback — כל נתיב לא-קיים מוחזר ל-index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache ארוך לנכסים עם hash בשם
    location /@/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
